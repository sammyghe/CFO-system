name: Ug Life deploy (Netlify)

# Publishes ug-life/game to https://ug-life.netlify.app. Netlify builds it, applies the
# database migrations in netlify/database/migrations, and publishes atomically.
# Started on demand (by Claude through the Netlify connection) with a short-lived
# deploy link as input. The link is read from the event file and masked, so it never
# appears in the logs of this public repository.

on:
  workflow_dispatch:
    inputs:
      deploy_link:
        description: "Short-lived Netlify deploy link (from the Netlify connector)"
        required: true
      site_id:
        description: "Netlify site id"
        required: false
        default: "00e4ff5d-a661-4736-9038-f3aafa58f7b2"

concurrency:
  group: ug-life-netlify
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ug-life/game
    steps:
      - name: Hide the deploy link
        run: |
          link=$(jq -r '.inputs.deploy_link' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$link"
          echo "DEPLOY_LINK=$link" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ug-life/game/package-lock.json
      - name: Test before shipping
        run: |
          npm ci
          npx vitest run tests/rules.test.ts tests/toon.test.ts
          rm -rf node_modules dist
      - name: Upload and build on Netlify
        run: npx -y @netlify/mcp@latest --site-id "$(jq -r '.inputs.site_id' "$GITHUB_EVENT_PATH")" --proxy-path "$DEPLOY_LINK"
      - name: Check the live site
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://ug-life.netlify.app/api/config; then echo; exit 0; fi
            sleep 20
          done
          echo "::warning::The site deployed but /api/config isn't answering yet."

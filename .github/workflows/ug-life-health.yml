name: Ug Life health check

# Every 30 minutes: is the game up, and is the API answering?
# If not, opens one GitHub issue labelled P0 (GitHub emails Sammy), and closes it when it recovers.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Find the live address
        id: url
        run: |
          url="${{ vars.UGLIFE_URL }}"
          [ -z "$url" ] && url="https://ug-life.netlify.app"
          if [ -z "$url" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            acct=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$acct/pages/projects/ug-life" | jq -r '.result.subdomain // empty')
            [ -n "$sub" ] && url="https://$sub"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Checking: ${url:-not deployed yet}"
      - name: Check (retries for 3 minutes before calling it down)
        id: probe
        if: steps.url.outputs.url != ''
        run: |
          url="${{ steps.url.outputs.url }}"
          for i in 1 2 3 4; do
            # the page, settings, and the database-backed land, leaderboard, talk, community and billboard endpoints
            if curl -fsS -m 15 "$url/" -o /dev/null && curl -fsS -m 15 "$url/api/config" -o /dev/null \
              && curl -fsS -m 15 "$url/api/land" | jq -e '.areas | length > 0' >/dev/null \
              && curl -fsS -m 15 "$url/api/leaderboard" | jq -e '.landlords' >/dev/null \
              && curl -fsS -m 15 -X POST -H 'content-type: application/json' -d '{}' "$url/api/live" | jq -e '.talk' >/dev/null \
              && curl -fsS -m 15 "$url/api/community" | jq -e '.events' >/dev/null \
              && curl -fsS -m 15 "$url/api/billboards" | jq -e '.ads' >/dev/null; then
              echo "up=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 45
          done
          echo "up=false" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        if: steps.url.outputs.url != ''
        with:
          script: |
            const up = '${{ steps.probe.outputs.up }}' === 'true';
            const title = 'P0: Ug Life is down';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'P0' });
            const existing = open.find((i) => i.title === title);
            if (!up && !existing) {
              await github.rest.issues.create({ ...context.repo, title, labels: ['P0'], body: `The game or its API didn't answer for 3 minutes at ${{ steps.url.outputs.url }}.\n\nPlayers can keep playing offline; saves and uploads wait. Check the latest deploy run and the Netlify function logs (site ug-life).\n\n---\n_Opened automatically by the Ug Life health check._` });
            } else if (up && existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: 'Back up. Closing automatically.\n\n---\n_Ug Life health check._' });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' });
            }

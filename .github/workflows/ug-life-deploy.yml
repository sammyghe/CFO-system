name: Ug Life deploy

# Every push that touches the game builds, tests and deploys it to Cloudflare Pages.
# main = the live site; any other branch = a preview link.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - Cloudflare token with "Cloudflare Pages: Edit" and "D1: Edit"
#   UGLIFE_ADMIN_TOKEN    - a long password for the Control Room (/admin.html)

on:
  push:
    paths: ["ug-life/game/**", ".github/workflows/ug-life-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: ug-life-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ug-life/game
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.UGLIFE_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ug-life/game/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check Cloudflare access
        id: access
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN isn't set yet, so the build was checked but not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the Pages project (first run only)
        if: steps.access.outputs.ok == 'true'
        run: npx wrangler pages project create ug-life --production-branch main || true
      - name: Update the database schema
        if: steps.access.outputs.ok == 'true' && github.ref_name == 'main'
        run: npx wrangler d1 migrations apply ug-life-db --remote
      - name: Set the Control Room password
        if: steps.access.outputs.ok == 'true' && env.ADMIN_TOKEN != ''
        run: printf '%s' "$ADMIN_TOKEN" | npx wrangler pages secret put ADMIN_TOKEN --project-name ug-life
      - name: Deploy
        if: steps.access.outputs.ok == 'true'
        run: npx wrangler pages deploy dist --project-name ug-life --branch "${GITHUB_REF_NAME}" --commit-hash "${GITHUB_SHA}" --commit-message "${GITHUB_SHA::7}"

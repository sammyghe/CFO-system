body{margin:0;background:transparent;font-family:Sans3,Arial,sans-serif}
.item{display:inline-block;padding:30px 40px 50px;vertical-align:top}
/* CAN */
.can{position:relative;width:300px;height:800px}
.can .lid{position:absolute;left:22px;top:0;width:256px;height:34px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#f4f6f8 0%,#c9cfd5 45%,#8d959d 70%,#d9dde1 85%,#7d858d 100%);box-shadow:inset 0 -3px 4px rgba(0,0,0,.25)}
.can .tab{position:absolute;left:118px;top:6px;width:64px;height:20px;border-radius:12px;border:3px solid #9aa2aa;background:linear-gradient(#e6e9ec,#b7bec5)}
.can .neck{position:absolute;left:0;top:17px;width:300px;height:44px;clip-path:polygon(7.5% 0,92.5% 0,100% 100%,0 100%);background:linear-gradient(90deg,#6f777f 0%,#c3c9cf 18%,#f2f4f6 30%,#b9c0c6 50%,#9aa2a9 75%,#6b737b 100%)}
.can .body{position:absolute;left:0;top:60px;width:300px;height:700px;overflow:hidden}
.can .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.18) 9%,rgba(255,255,255,.30) 21%,rgba(255,255,255,.08) 30%,rgba(255,255,255,0) 45%,rgba(0,0,0,.08) 65%,rgba(0,0,0,.25) 85%,rgba(0,0,0,.6) 100%);pointer-events:none}
.can .base{position:absolute;left:0;top:756px;width:300px;height:30px;border-radius:0 0 50% 50% / 0 0 100% 100%;background:linear-gradient(90deg,#5f676f 0%,#b9c0c6 20%,#eef1f3 32%,#aab1b8 55%,#8a929a 78%,#5b636b 100%)}
.can .shadow{position:absolute;left:10px;top:770px;width:280px;height:34px;border-radius:50%;background:rgba(10,25,40,.28);filter:blur(10px);z-index:-1}
.vert{position:absolute;white-space:nowrap;transform-origin:left top;transform:rotate(-90deg)}
/* JAR text */
.jarwrap{position:relative;width:520px;height:800px}
</style></head><body>

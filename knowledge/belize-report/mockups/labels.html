<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Bebas;src:url(../fonts/bebas-neue-latin-400-normal.woff2)}
@font-face{font-family:Sans3;src:url(../fonts/source-sans-3-latin-wght-normal.woff2);font-weight:200 900}
body{margin:0;padding:20px;background:#888;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.lab{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,#F3F8FC);font-family:Sans3}
.stripe{position:absolute;left:0;right:0;height:5%;background:#003F87;border-top:2px solid #CE1126;border-bottom:2px solid #CE1126}
.t{top:0;border-top:0}.b{bottom:0;border-bottom:0}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#0E2F55}
.nat{font-weight:700;letter-spacing:.42em;color:#0077B6}
.bz{font-family:Bebas;line-height:.86;letter-spacing:.02em;color:#0E2F55}
.sw{font-weight:700;letter-spacing:.34em;color:#0077B6}
.vol{font-weight:700;letter-spacing:.2em;color:#0E2F55}
.side{position:absolute;top:16%;font-size:9px;line-height:1.35;color:#0E2F55;width:22%}
.side b{display:block;font-size:10px;letter-spacing:.12em;color:#0077B6;margin-bottom:3px}
</style></head><body>
<div id="lab-jar" class="lab" style="width:544px;height:305px">
  <div class="stripe t"></div><div class="stripe b"></div>
  <svg style="position:absolute;left:0;bottom:7%;width:100%;height:30%" viewBox="0 0 544 90" preserveAspectRatio="none"><path d="M0 40 Q68 10 136 40 T272 40 T408 40 T544 40" fill="none" stroke="#7EC8E3" stroke-width="5"/><path d="M0 58 Q68 28 136 58 T272 58 T408 58 T544 58" fill="none" stroke="#0077B6" stroke-width="5"/><path d="M0 76 Q68 46 136 76 T272 76 T408 76 T544 76" fill="none" stroke="#0FA3A0" stroke-width="4"/></svg>
  <div class="c" style="padding-bottom:9%">
    <div class="nat" style="font-size:13px">NATURAL</div>
    <div class="bz" style="font-size:112px;margin-top:4px">BELIZE</div>
    <div class="sw" style="font-size:20px;margin-top:2px">SPRING WATER</div>
    <div class="vol" style="font-size:12px;margin-top:10px">18.9 L · 5 GAL</div>
  </div>
  <div class="side" style="left:4%"><b>FROM THE SPRING</b>Natural spring water, bottled in Belize.</div>
  <div class="side" style="right:4%;text-align:right"><b>RETURN &amp; REFILL</b>Returnable jar. Swap it for a full one.</div>
</div>
<div id="lab-bottle" class="lab" style="width:1040px;height:300px">
  <div class="stripe t"></div><div class="stripe b"></div>
  <svg style="position:absolute;left:0;bottom:7%;width:100%;height:28%" viewBox="0 0 1040 90" preserveAspectRatio="none"><path d="M0 40 Q65 10 130 40 T260 40 T390 40 T520 40 T650 40 T780 40 T910 40 T1040 40" fill="none" stroke="#7EC8E3" stroke-width="5"/><path d="M0 58 Q65 28 130 58 T260 58 T390 58 T520 58 T650 58 T780 58 T910 58 T1040 58" fill="none" stroke="#0077B6" stroke-width="5"/><path d="M0 76 Q65 46 130 76 T260 76 T390 76 T520 76 T650 76 T780 76 T910 76 T1040 76" fill="none" stroke="#0FA3A0" stroke-width="4"/></svg>
  <div class="c" style="padding-bottom:9%">
    <div class="nat" style="font-size:14px">NATURAL</div>
    <div class="bz" style="font-size:96px;margin-top:4px">BELIZE</div>
    <div class="sw" style="font-size:21px;margin-top:2px">SPRING WATER</div>
    <div class="vol" style="font-size:14px;margin-top:10px">500 ML</div>
  </div>
</div>
</body></html>

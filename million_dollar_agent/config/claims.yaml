  - {id: sales_30_days, reached_on: null}
  - {id: sales_90_days, reached_on: null}
  - {id: over_capacity_log, reached_on: null}
  - {id: site_2_open, reached_on: null}
  - {id: first_operator_signed, reached_on: null}
  - {id: bank_statements_3m, reached_on: null}
  - {id: five_sites, reached_on: null}
  - {id: first_co_investor, reached_on: null}
  - {id: one_year_trading, reached_on: null}

